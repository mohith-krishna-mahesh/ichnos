[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ichnos"
version = "0.1.0"
description = "A modular, low-level command-line security/CTF toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Ichnos Contributors" }]
keywords = ["security", "ctf", "cryptography", "steganography", "forensics", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "zxing-cpp>=2.2.0",
    "textual>=0.70.0",
]

[project.scripts]
ichnos = "ichnos.cli.main:app_entry"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ichnos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "E701", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
